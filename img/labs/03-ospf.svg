<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Three routers in a triangle, OSPF area 0, each with a loopback">
<style>
.txt{font-family:Inter Tight,ui-sans-serif,system-ui,sans-serif;fill:#eef0f3}
.mu{fill:#98a0ac}
