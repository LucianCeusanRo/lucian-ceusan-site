</style>
<rect width="640" height="280" fill="none"/>
<line class="ln" x1="320" y1="86" x2="160" y2="196" stroke="#7cc4ff"/>
<line class="ln" x1="320" y1="86" x2="480" y2="196" stroke="#8b7bff"/>
<line class="ln" x1="200" y1="210" x2="440" y2="210" stroke="#3ddc97"/>
<rect class="box rt" x="250" y="40" width="140" height="70" rx="14"/>
<text class="txt md" x="320.0" y="69.0" text-anchor="middle">R1</text>
<text class="txt mu sm" x="320.0" y="89.0" text-anchor="middle">lo0 1.1.1.1/32</text>
<rect class="box rt" x="90" y="180" width="140" height="70" rx="14"/>
<text class="txt md" x="160.0" y="209.0" text-anchor="middle">R2</text>
<text class="txt mu sm" x="160.0" y="229.0" text-anchor="middle">lo0 2.2.2.2/32</text>
<rect class="box rt" x="410" y="180" width="140" height="70" rx="14"/>
