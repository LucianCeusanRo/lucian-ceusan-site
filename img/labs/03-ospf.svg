<text class="txt mu sm" x="200" y="130" text-anchor="middle">10.0.12.0/30</text>
<text class="txt mu sm" x="440" y="130" text-anchor="middle">10.0.13.0/30</text>
<text class="txt mu sm" x="320" y="202" text-anchor="middle">10.0.23.0/30</text>
<text class="txt cap" x="320" y="268" text-anchor="middle">OSPF process 1 · area 0 · all three links + loopbacks advertised</text>
