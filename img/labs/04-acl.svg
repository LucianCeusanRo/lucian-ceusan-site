<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="Router-on-a-stick with Staff and Guest VLANs and ACLs on the router">
<style>
.txt{font-family:Inter Tight,ui-sans-serif,system-ui,sans-serif;fill:#eef0f3}
.mu{fill:#98a0ac}
.sm{font-size:13px}
.md{font-size:15px;font-weight:600}
.lg{font-size:16.5px;font-weight:700}
.box{fill:#13161b;stroke-width:1.6}
.sw{stroke:#7cc4ff}
.rt{stroke:#8b7bff}
.pc{stroke:#3ddc97}
.ln{stroke:#2b3039;stroke-width:1.6;fill:none}
.cap{font-size:12px;fill:#6b7280}
</style>
<rect width="640" height="260" fill="none"/>
<line class="ln" x1="160" y1="56" x2="250" y2="140" stroke="#3ddc97"/>
<line class="ln" x1="160" y1="140" x2="250" y2="152" stroke="#3ddc97"/>
<line class="ln" x1="160" y1="224" x2="250" y2="164" stroke="#3ddc97"/>
<line class="ln" x1="370" y1="152" x2="430" y2="152" stroke="#7cc4ff"/>
<rect class="box pc" x="20" y="24" width="140" height="56" rx="14"/>
<text class="txt md" x="90.0" y="46.0" text-anchor="middle">Server HTTP</text>
<text class="txt mu sm" x="90.0" y="66.0" text-anchor="middle">192.168.10.10</text>
<rect class="box pc" x="20" y="112" width="140" height="56" rx="14"/>
<text class="txt md" x="90.0" y="134.0" text-anchor="middle">PC Staff</text>
<text class="txt mu sm" x="90.0" y="154.0" text-anchor="middle">192.168.10.20</text>
<rect class="box pc" x="20" y="200" width="140" height="56" rx="14"/>
<text class="txt md" x="90.0" y="222.0" text-anchor="middle">PC Guest</text>
<text class="txt mu sm" x="90.0" y="242.0" text-anchor="middle">192.168.20.10</text>
<rect class="box sw" x="250" y="122" width="120" height="60" rx="14"/>
<text class="txt md" x="310.0" y="146.0" text-anchor="middle">SW1</text>
<text class="txt mu sm" x="310.0" y="166.0" text-anchor="middle">trunk to R1</text>
<rect class="box rt" x="430" y="114" width="180" height="76" rx="14"/>
<text class="txt md" x="520.0" y="146.0" text-anchor="middle">R1</text>
<text class="txt mu sm" x="520.0" y="166.0" text-anchor="middle">ACL on subinterfaces</text>
<text class="txt mu sm" x="200" y="84" text-anchor="middle">VLAN 10</text>
<text class="txt mu sm" x="200" y="230" text-anchor="middle">VLAN 20</text>
<text class="txt mu sm" x="400" y="140" text-anchor="middle">802.1Q</text>
<text class="txt mu sm" x="520" y="206" text-anchor="middle">std ACL 10 out on .10</text>
<text class="txt mu sm" x="520" y="224" text-anchor="middle">ext ACL in on .20</text>
</svg>
