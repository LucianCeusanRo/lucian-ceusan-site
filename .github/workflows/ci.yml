name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local HTML links and required files
        run: python tools/ci_links.py
